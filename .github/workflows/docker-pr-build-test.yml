name: PR Build & Test

on:
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          cd $GITHUB_WORKSPACE/Madplan
          docker compose build --pull
        env:
          Authentication__Google__ClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          Authentication__Google__ClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Run Docker Compose for testing
        run: |
          cd $GITHUB_WORKSPACE/Madplan
          docker compose down --volumes --remove-orphans || true
          docker compose up -d --build --remove-orphans
          sleep 15
          if ! docker ps | grep -q "app"; then
            echo "❌ App container failed to start!"
            docker compose logs || true
            docker compose down --volumes --remove-orphans
            exit 1
          fi
          echo "✅ App container is running."
          docker compose down --volumes --remove-orphans
        env:
          Authentication__Google__ClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          Authentication__Google__ClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
